name: gw-desktop CI

on:
  push:
    paths: ['gw-desktop/**', '.github/workflows/gw-desktop.yml']
  pull_request:
    paths: ['gw-desktop/**', '.github/workflows/gw-desktop.yml']
  workflow_dispatch:

concurrency:
  group: gw-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, unit tests, e2e tests (built UI + mocked backend) and Rust tests on Linux.
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gw-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gw-desktop/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build UI
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        run: npm run test:e2e:only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            gw-desktop/playwright-report
            gw-desktop/test-results
      - name: Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gw-desktop/src-tauri
      - name: Rust tests
        working-directory: gw-desktop/src-tauri
        run: cargo test

  # Windows release build: Rust tests on Windows, real-exe smoke test, portable exe and NSIS installer.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gw-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gw-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gw-desktop/src-tauri
      - run: npm ci
      - name: Build (exe + installer)
        run: npx tauri build
      - name: Rust tests (Windows)
        working-directory: gw-desktop/src-tauri
        run: cargo test
      - name: Install msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\edgedriver" | Out-Null
          Push-Location "$env:RUNNER_TEMP\edgedriver"
          & "$HOME\.cargo\bin\msedgedriver-tool.exe"
          Pop-Location
          "$env:RUNNER_TEMP\edgedriver" >> $env:GITHUB_PATH
      - name: Self-signed certificate for the AI mock
        shell: bash
        run: |
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -subj "/CN=smoke.local"
      - name: Smoke test (real exe via WebDriver)
        shell: bash
        run: node tests/smoke/smoke.mjs src-tauri/target/release/gw-desktop.exe "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: gw-desktop/smoke-results
      - name: Report size
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/gw-desktop.exe, src-tauri/target/release/bundle/nsis/*.exe |
            ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: gw-desktop-windows
          if-no-files-found: error
          path: |
            gw-desktop/src-tauri/target/release/gw-desktop.exe
            gw-desktop/src-tauri/target/release/bundle/nsis/*.exe
