[package]
name = "gw-desktop"
version = "0.1.0"
description = "Graphic Walker as a local-only Windows desktop app"
edition = "2021"

[lib]
name = "gw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls = Windows SChannel: uses the Windows certificate store (corporate CAs work)
# and keeps the binary smaller than bundling rustls + ring.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# API key lives in Windows Credential Manager, not in a plain-text file.
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
